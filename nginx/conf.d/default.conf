# INSTANT WEB CTF - public reverse proxy.
#
# This is the ONLY container with a published host port. Everything else
# (ctf-platform, instant-web, postgres, internal-api, template-service,
# infra-service) is reachable only over internal Docker networks.
#
# Routing:
#   /            -> ctf-platform  (CTF meta-layer: auth, dashboard, challenges, scoreboard, admin)
#   /company/*   -> instant-web   (the fictional Instant SaaS company; full path, including the
#                                  /company prefix, is forwarded unchanged - instant-web's own
#                                  Express app mounts its routers at matching /company/* paths.
#                                  This matters for cookie scoping: express-session's cookie.path
#                                  check is matched against the real request path it sees, so the
#                                  browser-visible path and the path Express sees must agree.)

server {
  listen 80;
  server_name _;

  # Docker's embedded DNS. Backend hostnames are resolved through variables
  # in proxy_pass below (instead of a static `upstream {}` block) so nginx
  # re-resolves them per the TTL below rather than once at startup - a
  # static upstream caches the resolved container IP for the life of the
  # nginx process, which breaks routing after `docker compose restart`
  # gives ctf-platform/instant-web new IPs while nginx keeps the old ones.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Used by the nginx container's own Docker HEALTHCHECK.
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /company/ {
    # No trailing slash on the proxy_pass target: nginx forwards the
    # original URI (including the /company prefix) unchanged.
    set $instant_web_upstream instant-web:3001;
    proxy_pass http://$instant_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  location / {
    set $ctf_platform_upstream ctf-platform:3000;
    proxy_pass http://$ctf_platform_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# HTTPS (443) is expected in production but requires real certificates for
# a real domain, which this local/Phase-1 environment does not have. See
# docs/DEPLOYMENT.md for how to add a server block here once certs are
# available (e.g. via certbot). Port 443 is still published by the nginx
# container so a certificate volume can be added without changing the
# Compose network/port surface.
